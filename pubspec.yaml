name: ges_agro_front
description: Aplicación móvil Flutter para gestión agrícola - GesAgro Frontend

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Core Framework & State Management
  flutter_riverpod: ^2.4.9
  
  # HTTP & Networking
  dio: ^5.4.0
  connectivity_plus: ^5.0.2
  
  # Storage & Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  
  # UI & Animations
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  auto_size_text: ^3.0.0
  
  # Charts & Data Visualization
  fl_chart: ^0.68.0
  
  # Date & Time
  intl: ^0.18.1
  table_calendar: ^3.0.9
  
  # Images & Media
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.9
  
  # Maps & Location
  geolocator: ^10.1.0
  google_maps_flutter: ^2.5.0
  permission_handler: ^11.0.1
  
  # Utilities
  url_launcher: ^6.2.1
  pull_to_refresh: ^2.0.0
  logger: ^2.0.2+1
  uuid: ^4.2.1
  equatable: ^2.0.5
  
  # Icons
  cupertino_icons: ^1.0.6
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
