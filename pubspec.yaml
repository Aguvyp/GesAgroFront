name: ges_agro_front
description: Aplicación móvil Flutter para gestión agrícola - GesAgro Frontend

publish_to: 'none'

version: 1.1.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Core Framework & State Management
  flutter_riverpod: ^2.4.9
  
  # HTTP & Networking
  dio: ^5.4.0
  http: ^1.2.2
  connectivity_plus: ^5.0.2
  
  # Storage & Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  
  # UI & Animations
  flutter_animate: ^4.3.0
  auto_size_text: ^3.0.0
  google_fonts: ^6.1.0
  
  # Charts & Data Visualization
  # Date & Time
  intl: ^0.18.1
  table_calendar: ^3.0.9
  
  # Images & Media
  # Maps & Location
  geolocator: ^10.1.0
  google_maps_flutter: ^2.5.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # Utilities
  url_launcher: ^6.2.1
  logger: ^2.0.2+1
  equatable: ^2.0.5
  
  # Icons
  cupertino_icons: ^1.0.6
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
